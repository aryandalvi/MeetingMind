<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeetingMind turns meeting transcripts into summaries, decisions, action items, deadlines and risks." />
    <title>MeetingMind — Your meetings, made meaningful</title>
    <script>
      // Set before first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem("meetingmind-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
